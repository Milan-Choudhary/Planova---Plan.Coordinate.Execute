# Planova AI - local stack.
#
# Credentials are NEVER written here. This file only REFERENCES variables that live in `.env`
# (copy .env.example -> .env first). `${VAR:?message}` makes compose stop with a clear error if
# a required variable is missing, instead of silently starting with an empty password.
#
#   docker compose up -d postgres        # database only (day-to-day: run backend/frontend from your IDE)
#   docker compose --profile app up -d --build    # database + backend + frontend, all containers
#   docker compose down                  # stop (keeps data)      |  docker compose down -v  # ALSO deletes DB data

name: planova

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Host port is configurable so it cannot clash with a PostgreSQL already on your machine.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - planova_pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ stops compose from substituting; the container's own shell expands them.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Inside the compose network the database is reached by service name on its internal port.
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  planova_pgdata:
